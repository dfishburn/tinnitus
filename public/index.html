<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Notched Audio Generator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">Notched Music for Tinnitus</a>
        <div class="collapse navbar-collapse">
          <ul id="nav" class="nav nav-tabs ms-3">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#find">Find</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#notch">Notch</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5 pt-3">

      <!-- Tab content -->
      <div class="tab-content">

        <!-- Find tab -->
        <div class="tab-pane fade show active" id="find">
          <div class="d-flex align-items-end gap-3 mb-2">
            <div>
              <label for="waveType" class="form-label">Wave Type</label>
              <select id="waveType" class="form-select w-auto">
                <option value="sine" selected>Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
              </select>
            </div>
            <div>
              <button id="startBtn" type="button" class="btn btn-success"><i class="bi bi-play-fill"></i></button>
            </div>
          </div>
          <canvas id="frequency"></canvas>
          <label class="form-label mt-2">Frequency: <span id="freq">440</span> Hz</label>
          <input id="freqSlider" type="range" min="0" max="20000" class="form-range">
          <label class="form-label mt-2">Gain: <span id="gainDisplay">50</span>%</label>
          <input id="gainSlider" type="range" min="0" max="100" value="50" class="form-range">
        </div>

        <!-- Notch tab -->
        <div class="tab-pane fade" id="notch">

          <!-- Source selection: Noise or Music -->
          <div class="mb-3">
            <div class="btn-group" role="group" id="sourceGroup">
              <input type="radio" class="btn-check" name="sourceType" id="sourceNoise" value="noise" checked>
              <label class="btn btn-outline-secondary" for="sourceNoise">Noise</label>
              <input type="radio" class="btn-check" name="sourceType" id="sourceMusic" value="music">
              <label class="btn btn-outline-secondary" for="sourceMusic">Music</label>
            </div>
          </div>

          <!-- Noise controls -->
          <div id="noiseControls" class="d-flex align-items-end gap-3 mb-3">
            <div>
              <label for="noiseType" class="form-label">Noise Type</label>
              <select id="noiseType" class="form-select w-auto">
                <option value="white" selected>White</option>
                <option value="pink">Pink</option>
                <option value="brown">Brown</option>
                <option value="blue">Blue</option>
                <option value="violet">Violet</option>
              </select>
            </div>
            <div>
              <button id="notchPlayBtn" type="button" class="btn btn-success" disabled>
                <i class="bi bi-play-fill"></i>
              </button>
            </div>
          </div>

          <!-- Music controls -->
          <div id="musicControls" class="mb-3" style="display:none">
            <div class="d-flex align-items-end gap-2 mb-2">
              <div>
                <label class="form-label">Add Files</label><br>
                <label class="btn btn-sm btn-outline-primary mb-0">
                  Choose Files
                  <input type="file" id="musicFiles" accept="audio/*" multiple style="display:none">
                </label>
              </div>
              <div>
                <label class="form-label">Add Folder</label><br>
                <label class="btn btn-sm btn-outline-primary mb-0">
                  Choose Folder
                  <input type="file" id="musicFolder" accept="audio/*" webkitdirectory multiple style="display:none">
                </label>
              </div>
              <button id="clearPlaylist" type="button" class="btn btn-sm btn-outline-danger">Clear</button>
            </div>
            <!-- Playback controls -->
            <div class="d-flex align-items-center gap-2 mb-2">
              <button id="musicPlayBtn" type="button" class="btn btn-success" disabled>
                <i class="bi bi-play-fill"></i>
              </button>
              <button id="musicPrevBtn" type="button" class="btn btn-secondary" disabled>
                <i class="bi bi-skip-start-fill"></i>
              </button>
              <button id="musicNextBtn" type="button" class="btn btn-secondary" disabled>
                <i class="bi bi-skip-end-fill"></i>
              </button>
              <span id="musicNowPlaying" class="text-muted small ms-2">No file loaded</span>
            </div>
            <!-- Playlist -->
            <ul id="playlist" class="list-group" style="max-height:200px; overflow-y:auto"></ul>
          </div>

          <!-- EQ -->
          <div class="d-flex align-items-center gap-3 mb-3">
            <h5 class="mb-0">Notch Frequency Chooser</h5>
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" id="eqManual">
              <label class="form-check-label" for="eqManual">Manual</label>
            </div>
          </div>
          <div id="eq-container" class="d-flex gap-2 align-items-end mb-3">
            <!-- bands injected by equalizer.js -->
          </div>
          <div class="text-muted small mb-3">
            Drag sliders down to cut frequencies around your tinnitus. Use Manual to customise.
          </div>
          <!-- Notch tab volume -->
          <label class="form-label">Volume: <span id="notchGainDisplay">50</span>%</label>
          <input id="notchGainSlider" type="range" min="0" max="100" value="50" class="form-range">
        </div>

      </div>
    </div>

    <!-- jQuery 3 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/raf.js"></script>
    <script src="js/dnd.js"></script>
    <script src="js/audio-node.js"></script>
    <script src="js/generate.js"></script>
    <script src="js/render.js"></script>
    <script src="js/equalizer.js"></script>
    <script src="js/music.js"></script>
    <script src="js/app.js"></script>
    <script src="js/find.js"></script>
  </body>
</html>
